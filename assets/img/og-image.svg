<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="630" fill="#FAF6F3"/>

    <!-- decorative grid lines, subtle -->
    <g stroke="#E6DDD7" stroke-width="1">
      <line x1="0" y1="150" x2="1200" y2="150"/>
      <line x1="0" y1="480" x2="1200" y2="480"/>
    </g>

    <!-- accent corner blocks -->
    <rect x="0" y="0" width="1200" height="14" fill="#E27634"/>
    <rect x="0" y="616" width="1200" height="14" fill="#2F1208"/>

    <!-- accent shape: stylised map pin / node cluster -->
    <g transform="translate(940,120)">
      <circle cx="0" cy="0" r="150" fill="#472A1E" opacity="0.06"/>
      <circle cx="30" cy="60" r="7" fill="#E27634"/>
      <circle cx="130" cy="30" r="10" fill="#F77523"/>
      <circle cx="90" cy="140" r="6" fill="#7F370E"/>
      <line x1="30" y1="60" x2="130" y2="30" stroke="#E27634" stroke-width="2"/>
      <line x1="130" y1="30" x2="90" y2="140" stroke="#F77523" stroke-width="2"/>
      <line x1="30" y1="60" x2="90" y2="140" stroke="#7F370E" stroke-width="2"/>
    </g>

    <text x="90" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#230D09" font-weight="500">Surabhi Gupta</text>

    <text x="92" y="280" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#83746E">GIS Business Analyst</text>
    <text x="92" y="318" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#83746E">Spatial Data Engineering &amp; GeoAI</text>

    <g transform="translate(92,380)">
      <rect x="0" y="0" width="230" height="46" rx="23" fill="#2F1208"/>
      <text x="115" y="30" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FAF6F3" text-anchor="middle" font-weight="600">surabhigeo.com</text>
    </g>

    <text x="90" y="560" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#7F370E" font-weight="600">GeoCloud Insights · 5,600+ LinkedIn following</text>
  </g>
</svg>
